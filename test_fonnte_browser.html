<!DOCTYPE html>
<html>
<body>
<script>
  const fd = new FormData();
  fd.append('target', '081234567890');
  fd.append('message', 'test');
  
  fetch('https://api.fonnte.com/send', {
    method: 'POST',
    headers: {
        'Authorization': 'test'
    },
    body: fd
  }).then(res => res.text()).then(console.log);
</script>
</body>
</html>
